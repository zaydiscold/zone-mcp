# The Xcode project for Zone for Mac. Generate it with `xcodegen generate` in this folder
# (scripts/build-app.sh does that for you).
name: Zone
options:
  bundleIdPrefix: wtf.zayd
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9H224CYHBX
    DEAD_CODE_STRIPPING: YES
packages:
  ZoneKit:
    path: ZoneKit
targets:
  Zone:
    type: application
    platform: macOS
    sources:
      - path: Zone
    dependencies:
      - package: ZoneKit
    settings:
      base:
        PRODUCT_NAME: Zone
        PRODUCT_BUNDLE_IDENTIFIER: wtf.zayd.zone.mac
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zone
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License. zayd.wtf"
        # Flash in a Zone window reads the iPhone's screen with the camera.
        INFOPLIST_KEY_NSCameraUsageDescription: "Flash reads your iPhone's screen through this Mac's camera. Nothing is recorded or sent anywhere."
        # The zone this app starts counts as the app, and reaches the phone directly when both
        # are on the same network.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Zone connects straight to your iPhone when both are on the same network. Without this, your dictations still arrive, through the relay."
        # The hardened runtime's camera entitlement (Zone/Zone.entitlements). build-app.sh
        # signs with the same file.
        CODE_SIGN_ENTITLEMENTS: Zone/Zone.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # The app carries the `zone` program inside it. scripts/build-app.sh puts the
      # universal one at build/zone; a plain Xcode build falls back to the repository's
      # own release build.
      - name: Embed zone
        basedOnDependencyAnalysis: false
        script: |
          set -e
          source_binary="${ZONE_BINARY:-$SRCROOT/build/zone}"
          [ -f "$source_binary" ] || source_binary="$SRCROOT/../target/release/zone"
          if [ ! -f "$source_binary" ]; then
            echo "warning: no zone program to embed. Run mac/scripts/build-zone-binary.sh first."
            exit 0
          fi
          # Not in Contents/MacOS: on the usual Mac disk, which ignores case in file names,
          # "zone" there would be the same file as the app's own program, "Zone".
          destination="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers/zone"
          mkdir -p "$(dirname "$destination")"
          rm -f "$destination"
          cp "$source_binary" "$destination"
          chmod 755 "$destination"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$destination"
          fi
schemes:
  Zone:
    build:
      targets:
        Zone: all
    run:
      config: Debug
    archive:
      config: Release
