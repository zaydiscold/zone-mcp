<style nonce="__NONCE__">
/* Zone's look, as in the iPhone app and Zone for Mac: warm paper and ink, one accent used
   sparingly, a serif for the wordmark, headings and numbers. Flat surfaces, 1 pt rules,
   hard-edged shadows. Zone Serif is Charis SemiBold (SIL Global, OFL 1.1), subset and renamed,
   served by zone itself: see assets/fonts. Safari draws New York instead, as the Mac app does.
   The appearance (data-theme: auto, light, dark) and the accent (data-accent, the iPhone app's
   five) are chosen in Settings and set by the server before the first paint. */
@font-face {
  font-family: "Zone Serif";
  src: url("/font/zone-serif.woff2") format("woff2");
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}
:root {
  --paper: #2a2a2a; --card: #333333; --field: #262626; --ink: #f1e9d2; --muted: #c9c1ab; --quiet: #a5a092;
  --faint: rgba(241, 233, 210, 0.42); --rule: rgba(241, 233, 210, 0.16); --rule-strong: rgba(241, 233, 210, 0.3);
  --hover: rgba(241, 233, 210, 0.07); --press: rgba(241, 233, 210, 0.12);
  --on-ink: #2a2a2a; --alarm: #ff6b6b; --shadow: rgba(0, 0, 0, 0.5);
  --qr-paper: #f7f2e4; --qr-ink: #2a2a2a;
  /* The accent: bright on dark paper, a deeper tone of the same hue on cream. */
  --ad: #9b7dff; --atd: #a68bff; --al: #7a5af0; --atl: #6a4bdb;
  --accent: var(--ad); --accent-text: var(--atd);
  --accent-wash: color-mix(in srgb, var(--accent) 20%, transparent);
  /* One quiet hue per kind, so a list can be read at a glance. Dictations stay ink. */
  --k-note: #e3b65c; --k-meeting: #6cc5b0; --k-clip: #7fb2f0; --k-dictation: var(--quiet);
  --serif: ui-serif, "Zone Serif", Charter, "Iowan Old Style", "Sitka Text", Cambria, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Ubuntu, Cantarell, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --settle: cubic-bezier(0.22, 1, 0.36, 1);
  --bar: 56px;
}
:root[data-accent="ice"] { --ad: #8ee8ff; --atd: #8ee8ff; --al: #007d9d; --atl: #0a6b84; }
:root[data-accent="ember"] { --ad: #ff9a6b; --atd: #ff9a6b; --al: #d14200; --atl: #a6461e; }
:root[data-accent="mint"] { --ad: #a9dec4; --atd: #a9dec4; --al: #16844e; --atl: #32644d; }
:root[data-accent="rose"] { --ad: #f2b8cf; --atd: #f2b8cf; --al: #db246d; --atl: #923d61; }
:root[data-theme="light"] {
  --paper: #f1e9d2; --card: #f7f2e4; --field: #f6efdb; --ink: #333333; --muted: #555555; --quiet: #686660;
  --faint: rgba(51, 51, 51, 0.5); --rule: rgba(51, 51, 51, 0.18); --rule-strong: rgba(51, 51, 51, 0.32);
  --hover: rgba(51, 51, 51, 0.06); --press: rgba(51, 51, 51, 0.11);
  --on-ink: #f1e9d2; --alarm: #b3261e; --shadow: rgba(0, 0, 0, 0.16);
  --accent: var(--al); --accent-text: var(--atl);
  --k-note: #8a5d00; --k-meeting: #17695b; --k-clip: #2a5ea8;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --paper: #f1e9d2; --card: #f7f2e4; --field: #f6efdb; --ink: #333333; --muted: #555555; --quiet: #686660;
    --faint: rgba(51, 51, 51, 0.5); --rule: rgba(51, 51, 51, 0.18); --rule-strong: rgba(51, 51, 51, 0.32);
    --hover: rgba(51, 51, 51, 0.06); --press: rgba(51, 51, 51, 0.11);
    --on-ink: #f1e9d2; --alarm: #b3261e; --shadow: rgba(0, 0, 0, 0.16);
    --accent: var(--al); --accent-text: var(--atl);
    --k-note: #8a5d00; --k-meeting: #17695b; --k-clip: #2a5ea8;
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar) + 60px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14.5px/1.5 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-variant-numeric: tabular-nums; }
::selection { background: var(--accent-wash); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-weight: 600; text-decoration: none; }
.skip:focus { top: 12px; }
code, kbd { font-family: var(--mono); font-size: 0.88em; }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--rule); font: 500 11.5px/1 var(--sans); color: var(--quiet); }
svg.i { width: 15px; height: 15px; flex: none; }

.mark { display: inline-flex; align-items: baseline; gap: 0.06em; font: 600 24px/1 var(--serif); letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
.mark .dot { display: inline-block; width: 0.2em; height: 0.2em; border-radius: 50%; background: var(--accent); }

.button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 999px; white-space: nowrap; font-size: 13px; font-weight: 550; text-decoration: none; background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.button:hover { background: var(--hover); }
.button:active { transform: scale(0.97); }
.button.primary { background: var(--ink); color: var(--on-ink); box-shadow: none; font-weight: 600; }
.button.primary:hover { opacity: 0.9; }
.button.danger { color: var(--alarm); }
.button:disabled { opacity: 0.5; cursor: default; }
.textbutton { color: var(--accent-text); font-size: 13px; font-weight: 550; text-decoration: none; }
.textbutton:hover { text-decoration: underline; text-underline-offset: 3px; }
.iconbtn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
.iconbtn:hover { background: var(--hover); color: var(--ink); }
.seg { display: inline-flex; padding: 2px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--rule); }
.seg button { height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 550; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--press); color: var(--ink); }

/* ---------------------------------------------------------------- the bar */
header.top { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.bar { display: flex; align-items: center; gap: 14px; min-height: var(--bar); max-width: 1480px; margin: 0 auto; padding: 0 24px; }
.tabs { display: flex; align-items: center; gap: 2px; margin-left: 10px; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 8px; color: var(--muted); font-size: 13.5px; font-weight: 550; text-decoration: none; white-space: nowrap; }
.tab:hover { background: var(--hover); color: var(--ink); }
.tab[aria-current="page"] { background: var(--press); color: var(--ink); }
.tab .n { font: 600 12.5px/1 var(--serif); color: var(--quiet); }
.search { position: relative; display: block; flex: 1 1 200px; max-width: 360px; margin-left: auto; }
.search svg { position: absolute; left: 11px; top: 50%; margin-top: -7.5px; color: var(--quiet); pointer-events: none; }
.search input { width: 100%; height: 34px; padding: 0 32px 0 33px; border-radius: 9px; background: var(--field); border: 0; box-shadow: inset 0 0 0 1px var(--rule); font-size: 13.5px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--quiet); opacity: 1; }
.search input:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-wash); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search kbd { position: absolute; right: 8px; top: 50%; margin-top: -10px; }
.search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
.device { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 9px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.device:hover, .device[aria-expanded="true"] { background: var(--hover); }
.device b { color: var(--ink); font-weight: 600; }
.device svg { color: var(--quiet); }
/* The state light: filled when a phone is paired, a hollow ring when none is. It pulses once
   when something arrives from a phone. That is the only moving thing in the bar. */
.light { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.light.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.light::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0; }
.light.ping::after { animation: ping 2s var(--settle) 2; }
@keyframes ping { from { opacity: 0.8; transform: scale(0.6); } to { opacity: 0; transform: scale(1.8); } }
.pop { position: absolute; z-index: 40; top: calc(100% + 6px); right: 0; width: min(360px, calc(100vw - 24px)); padding: 6px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule), 2px 3px 0 var(--shadow); }
.popwrap { position: relative; }
.pop h2 { margin: 6px 10px 4px; font-size: 12px; font-weight: 550; color: var(--quiet); }
.prow { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; border-radius: 8px; }
.prow:hover { background: var(--hover); }
.prow .pick { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; }
.prow .radio { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); flex: none; }
.prow[aria-current="true"] .radio { box-shadow: inset 0 0 0 4.5px var(--accent); }
.prow .who { min-width: 0; }
.prow .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .who small { display: block; color: var(--quiet); font-size: 12px; }
.prow input.name { flex: 1 1 auto; min-width: 0; height: 30px; padding: 0 9px; border-radius: 7px; border: 0; background: var(--field); box-shadow: inset 0 0 0 1px var(--accent); }
.pop .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; padding: 8px 8px 4px 10px; border-top: 1px solid var(--rule); }
.pop .ask { padding: 8px 10px; font-size: 13px; color: var(--muted); }
.pop .ask div { display: flex; gap: 8px; margin-top: 8px; }

/* ---------------------------------------------------------------- views */
main { max-width: 1480px; margin: 0 auto; padding: 0 24px 96px; }
.vhead { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 22px 0 14px; }
.vhead h1 { margin: 0; font: 600 30px/1.1 var(--serif); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.vhead .sub { color: var(--muted); font-size: 13.5px; }
.vhead .sp { margin-left: auto; }
.note-line { margin: 0 0 14px; color: var(--quiet); font-size: 12.5px; }

/* Home: what to do (notes), what to tackle (meetings), and what was said lately. */
.strip { display: flex; align-items: stretch; gap: 0; margin: 14px 0; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); text-decoration: none; overflow: hidden; }
.strip:hover { box-shadow: inset 0 0 0 1px var(--rule-strong); }
.fig { flex: 0 1 auto; padding: 10px 18px; border-right: 1px solid var(--rule); min-width: 0; }
.fig small { display: block; color: var(--quiet); font-size: 12px; font-weight: 550; white-space: nowrap; }
.fig b { display: block; font: 600 21px/1.25 var(--serif); white-space: nowrap; }
.fig span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }
.fig.chart { flex: 1 1 220px; border-right: 0; display: flex; flex-direction: column; min-width: 160px; }
.fig.chart svg { flex: 1 1 auto; width: 100%; height: 44px; margin-top: 4px; }
.home { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.9fr); gap: 14px; height: calc(100vh - var(--bar) - 122px); min-height: 380px; }
.panel { display: flex; flex-direction: column; min-height: 0; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); border-top: 3px solid var(--kc, var(--rule-strong)); }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px; border-bottom: 1px solid var(--rule); }
.panel > header h2 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 18px/1.2 var(--serif); }
.panel > header h2 svg { color: var(--kc, var(--muted)); }
.panel > header h2 a { color: var(--ink); }
.panel > header .n { color: var(--muted); font-size: 12.5px; }
.panel > header .sp { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.panel .scroll { flex: 1 1 auto; overflow-y: auto; padding: 0 6px 6px; }
.panel .sub { margin: 0; padding: 12px 8px 4px; font-size: 12px; font-weight: 550; color: var(--quiet); display: flex; align-items: center; gap: 7px; }
.panel .sub svg { color: var(--kc); }
.kc-note { --kc: var(--k-note); } .kc-meeting { --kc: var(--k-meeting); } .kc-clip { --kc: var(--k-clip); } .kc-dictation { --kc: var(--k-dictation); }
.empty { padding: 26px 12px; color: var(--muted); font-size: 13.5px; }
.empty h3 { margin: 0 0 6px; font: 600 19px/1.2 var(--serif); color: var(--ink); }
.empty p { margin: 0 0 12px; max-width: 46ch; }
.welcome { max-width: 560px; padding: 60px 0; }
.welcome h1 { margin: 0 0 10px; font: 600 34px/1.1 var(--serif); }
.welcome ol { margin: 0 0 22px; padding-left: 20px; color: var(--muted); }
.welcome li { margin: 6px 0; }

/* One item, the same in every list. The kind shows in the stripe, the icon and the label. */
.row { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 8px; padding: 10px 8px 9px 10px; border-radius: 8px; --kc: var(--k-dictation); }
.row + .row { box-shadow: 0 -1px 0 var(--rule); }
.row::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--kc); opacity: 0.9; }
.row.k-dictation::before { opacity: 0.28; }
.row.k-note { --kc: var(--k-note); } .row.k-meeting { --kc: var(--k-meeting); } .row.k-clip { --kc: var(--k-clip); }
.row:hover { background: var(--hover); }
.row.cur { background: var(--hover); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.row.sel { background: var(--accent-wash); }
.row .lead { padding-top: 1px; display: flex; justify-content: center; color: var(--kc); }
.row .lead svg { margin-top: 3px; }
.check { width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--kc); display: grid; place-items: center; color: transparent; flex: none; }
.check:hover { background: color-mix(in srgb, var(--kc) 22%, transparent); }
.check[aria-checked="true"] { background: var(--kc); color: var(--paper); }
.check svg { width: 11px; height: 11px; margin: 0 !important; }
.row h3 { margin: 0 0 2px; font: 600 16.5px/1.3 var(--serif); }
.row h3 a { text-decoration: none; }
.row h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.text { margin: 0; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.big .text { font-size: 15.5px; line-height: 1.58; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: var(--lines, 4); line-clamp: var(--lines, 4); }
.l1 { --lines: 1; } .l2 { --lines: 2; } .l3 { --lines: 3; } .l6 { --lines: 6; } .l10 { --lines: 10; }
.row.k-clip .text { font-family: var(--mono); font-size: 12.5px; }
.row.done .text, .row.done h3 { color: var(--quiet); }
.row.k-note.done .text { text-decoration: line-through; text-decoration-color: var(--faint); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0 0; margin-top: 3px; color: var(--quiet); font-size: 12px; min-height: 20px; }
.meta > span { white-space: nowrap; }
.meta > span + span::before { content: "\00b7"; display: inline-block; width: 13px; text-align: center; color: var(--faint); }
.meta .kind { color: var(--kc); font-weight: 600; }
.meta .kind.k-dictation { color: var(--muted); }
.meta .src { border-bottom: 1px dotted var(--faint); cursor: help; }
.meta .donetag { color: var(--muted); }
.who-chip { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; margin: 3px 4px 0 0; border-radius: 999px; font-size: 11.5px; font-weight: 550; color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule); }
.acts { position: absolute; right: 6px; bottom: 5px; display: flex; gap: 1px; padding: 2px; border-radius: 9px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); }
.acts .iconbtn { width: 27px; height: 27px; border-radius: 7px; }
.acts .iconbtn.on { color: var(--accent-text); }
.acts .iconbtn.rm:hover { color: var(--alarm); }
@media (hover: hover) {
  .row .acts { opacity: 0; pointer-events: none; }
  .row:hover .acts, .row:focus-within .acts, .row.cur .acts, .row.sel .acts { opacity: 1; pointer-events: auto; }
}
@media (hover: none) { .row .acts { position: static; grid-column: 2; justify-self: start; margin-top: 6px; } }
mark { background: var(--accent-wash); color: inherit; border-radius: 2px; padding: 0 1px; box-shadow: inset 0 -1.5px 0 var(--accent); }
.row.arrived .text, .row.arrived h3 { animation: land 1.6s var(--settle) both; }
@keyframes land { from { color: var(--accent-text); } to { color: var(--ink); } }

/* A list view: optional rail of filters, and the list. */
.cols { display: grid; grid-template-columns: 236px minmax(0, 820px); column-gap: 48px; }
.one { max-width: 860px; }
.rail { position: sticky; top: calc(var(--bar) + 1px); align-self: start; max-height: calc(100vh - var(--bar)); overflow-y: auto; scrollbar-width: none; padding: 4px 0 32px; }
.rail::-webkit-scrollbar { display: none; }
.rail .seg button { padding: 0 8px; font-size: 12px; }
.group { margin-bottom: 22px; }
.eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 550; color: var(--quiet); }
.choices { display: flex; flex-direction: column; gap: 1px; margin: 0 -8px; }
.choice { display: flex; align-items: center; gap: 9px; min-height: 30px; padding: 4px 8px; border-radius: 8px; color: var(--muted); font-size: 13.5px; }
.choice svg { color: var(--kc, var(--quiet)); }
.choice span.l { flex: 1 1 auto; }
.choice:hover { background: var(--hover); color: var(--ink); }
.choice .n { font: 600 13px/1 var(--serif); color: var(--quiet); }
.choice[aria-pressed="true"] { background: var(--press); color: var(--ink); font-weight: 600; }
.explain { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--quiet); }
.explain li { margin: 0 0 5px; }
.explain b { color: var(--muted); font-weight: 600; }
details.what summary { cursor: pointer; font-size: 12px; color: var(--accent-text); margin-top: 6px; }
.cal { margin-top: 12px; }
.calHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.calHead h3 { margin: 0; font: 600 15px/1.2 var(--serif); }
.calHead div { display: flex; gap: 2px; margin-right: -6px; }
.calHead button:disabled { opacity: 0.35; cursor: default; background: none; }
table.month { width: 100%; border-collapse: separate; border-spacing: 0 2px; table-layout: fixed; }
.month th { height: 24px; font-size: 11.5px; font-weight: 550; color: var(--quiet); }
.month td { padding: 0; text-align: center; }
.month td.in { background: var(--accent-wash); }
.month td.first { border-radius: 999px 0 0 999px; }
.month td.last { border-radius: 0 999px 999px 0; }
.month td.first.last { border-radius: 999px; }
.day-cell { position: relative; width: 30px; height: 30px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; color: var(--quiet); }
.day-cell.has { color: var(--ink); }
.day-cell.has::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--accent); }
.day-cell:hover:not(:disabled) { background: var(--hover); }
.day-cell.today { box-shadow: inset 0 0 0 1px var(--rule-strong); }
.day-cell.edge { background: var(--ink); color: var(--on-ink); font-weight: 650; }
.day-cell.edge::after { background: var(--on-ink); }

dialog { width: min(440px, calc(100vw - 28px)); max-height: calc(100vh - 40px); padding: 0; border: 0; border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule), 3px 4px 0 var(--shadow); }

<main id="view" tabindex="-1" aria-live="off"></main>

<button class="fresh" id="fresh" type="button" hidden><i aria-hidden="true"></i>New items. Show them</button>
<div class="selbar" id="selbar" hidden></div>

</dialog>

    const scope = ex.scope;
    const order = ex.order || (scope.params && scope.params.order) || "oldest";
    const seg = (box, options, current, pick) => box.replaceChildren(...options.map(([value, name]) => btn(null, name, () => pick(value), { "aria-pressed": String(current === value) })));
    seg($("exportFormat"), [["md", "Markdown"], ["txt", "Plain text"], ["csv", "CSV"], ["json", "JSON"]], ex.format, (value) => { ex.format = value; store.set("exportFormat", value); loadExport(); });
    seg($("exportOrder"), [["oldest", "Oldest first"], ["newest", "Newest first"]], order, (value) => { ex.order = value; loadExport(); });
    const params = scope.ids ? new URLSearchParams({ ids: scope.ids.join(","), format: ex.format, order }).toString() : qs(Object.assign({}, scope.params, { format: ex.format, order, limit: "", title: scope.title || "" }));
    $("exportPreview").textContent = "";
    try {
      ex.data = await api("/api/export?" + params);
      const shapes = { checklist: "a checklist: open notes unticked, done ones ticked", meeting: "a transcript under a header", dated: "a document by day, grouped by kind" };
      $("exportWhat").textContent = plural(ex.data.items, "item", "items") + (ex.format === "md" || ex.format === "txt" ? ", as " + shapes[ex.data.shape] : "") + ". Removed items are never included.";
      $("exportPreview").textContent = ex.data.content.length > 6000 ? ex.data.content.slice(0, 6000) + "\n…" : ex.data.content;
    } catch (error) { ex.data = null; $("exportWhat").textContent = "Could not export. " + error.message; }
  }
  function openExport(scope) {
    if (!scope) return;
    ex.scope = scope; ex.order = "";
    if (!$("export").open) $("export").showModal();
    loadExport();
  }
  $("exportClose").addEventListener("click", () => $("export").close());
  $("exportCopy").addEventListener("click", async () => { if (!ex.data) return; await copyText(ex.data.content); $("export").close(); toast(plural(ex.data.items, "item", "items") + " copied."); });
  $("exportSave").addEventListener("click", () => {
    if (!ex.data) return;
    const types = { md: "text/markdown", txt: "text/plain", csv: "text/csv", json: "application/json" };
    const url = URL.createObjectURL(new Blob([ex.data.content], { type: (types[ex.data.format] || "text/plain") + ";charset=utf-8" }));
    const link = h("a", { href: url, download: ex.data.filename });
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Saved as " + ex.data.filename + ".");
  });

  // ---------------------------------------------------------------- pairing

  let countdown = 0;
  async function newCode() {
    clearInterval(countdown);
    $("pairErr").hidden = true; $("pairBody").hidden = false;
    $("qr").textContent = ""; $("expires").textContent = "";
    let offer;
    try { offer = await api("/api/pair", {}); }
    catch (_) {
      $("pairBody").hidden = true; $("pairErr").hidden = false;
      $("pairErr").textContent = "Could not make a pairing code. Check that zone is still running, then try again.";
      return;
    }
    // The server drew this SVG itself from the link. It contains only rectangles.
    const code = new DOMParser().parseFromString(offer.svg, "image/svg+xml").documentElement;
    if (code && code.nodeName === "svg") $("qr").append(document.importNode(code, true));
    $("pairUrl").value = offer.url;
    const ends = Date.now() + offer.expires_in_s * 1000;
    const tick = () => {
      const left = Math.max(0, Math.round((ends - Date.now()) / 1000));
      if (left) $("expires").replaceChildren("Valid for ", h("b", null, Math.floor(left / 60) + ":" + pad(left % 60)));
      else { $("expires").textContent = "This code has expired. Make a new one."; clearInterval(countdown); $("qr").textContent = ""; $("pairUrl").value = ""; }
    };
    tick();
    countdown = setInterval(tick, 1000);
  }
  function openPair() { if ($("pair").open) return; $("pair").showModal(); newCode(); }
  $("pairNew").addEventListener("click", newCode);
  $("pairClose").addEventListener("click", () => $("pair").close());
  $("pair").addEventListener("close", () => { clearInterval(countdown); $("qr").textContent = ""; $("pairUrl").value = ""; if (R.view === "pair") go("home", "", {}, true); else refreshStatus(); });
  $("pairCopy").addEventListener("click", async () => { await copyText($("pairUrl").value); $("pairCopy").textContent = "Copied"; setTimeout(() => { $("pairCopy").textContent = "Copy"; }, 1400); });
  document.querySelectorAll("dialog").forEach((dialog) => dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); }));

  // ---------------------------------------------------------------- search and keys

  let typing = 0;
  $("q").addEventListener("input", (event) => {
    clearTimeout(typing);
    typing = setTimeout(() => {
      const q = event.target.value.trim();
      if (R.view === "history") setP({ q }, true); else if (q) go("history", "", { q });
    }, 180);
  });
  $("q").addEventListener("keydown", (event) => {
    if (event.key === "Escape") { event.preventDefault(); if (event.target.value) { event.target.value = ""; if (R.view === "history") setP({ q: "" }, true); } else event.target.blur(); }
    if (event.key === "Enter" || event.key === "ArrowDown") { event.preventDefault(); event.target.blur(); moveCursor(1); }
  });
  const KEYS = [["/", "Search"], ["g h", "Home"], ["g n", "Notes"], ["g m", "Meetings"], ["g a", "History, everything"], ["g s", "Statistics"], ["g ,", "Settings"], ["j  k", "Next and previous item"], ["Enter", "Open the item"], ["x", "Done, or not done"], ["c", "Copy"], ["e", "Export the item, the selection, or the view"], ["s", "Select, to act on several"], ["Esc", "Clear the selection, close"], ["?", "This list"]];
  $("keysList").append(...KEYS.flatMap(([keys, what]) => [h("dt", null, keys.split(" ").filter(Boolean).map((k) => [h("kbd", null, k), " "])), h("dd", null, what)]));
  $("keysOpen").addEventListener("click", () => $("keys").showModal());
  $("keysClose").addEventListener("click", () => $("keys").close());
  let chord = 0;
  document.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.querySelector("dialog[open]")) return;
    const key = event.key;
    if (chord) {
      const to = { h: "home", n: "notes", m: "meetings", a: "history", s: "stats", ",": "settings" }[key];
      chord = 0;
      if (to) { event.preventDefault(); go(to); }
      return;
    }
    const ids = targets();
    const done = () => event.preventDefault();
    if (key === "/") { done(); $("q").focus(); $("q").select(); }
    else if (key === "?") { done(); $("keys").showModal(); }
    else if (key === "g") { chord = 1; setTimeout(() => { chord = 0; }, 1200); }
    else if (key === "j" || key === "k") { done(); moveCursor(key === "j" ? 1 : -1); }
    else if (key === "Escape") { if (!$("devices").hidden) closeDevices(); else if (S.sel.size) clearSelection(); else setCursor(null); }
    else if (key === "Enter" && S.cur && document.activeElement === document.body) { const item = S.items.get(S.cur); if (item && document.querySelector(".row.cur")) { done(); location.hash = item.kind === "meeting" ? href("meeting", item.id) : href("item", item.id); } }
    else if (key === "x" && (ids.length || R.view === "meeting" || R.view === "item")) { done(); const list = ids.length ? ids : [R.arg.toUpperCase()]; const first = S.items.get(list[0]) || S.items.get(R.arg); setDone(list, !(first && first.done)).then(() => { if (!ids.length) route(); }); }
    else if (key === "c" && (ids.length || R.view === "meeting" || R.view === "item")) { done(); copyItems(ids.length ? ids : [[...S.items.keys()].find((id) => id.toLowerCase() === R.arg.toLowerCase()) || R.arg]); }
    else if (key === "e") { done(); if (ids.length) openExport({ ids }); else if (R.view === "meeting" || R.view === "item") openExport({ ids: [R.arg] }); else openExport(S.scope); }
    else if (key === "s" && S.cur && document.querySelector(".row.cur")) { done(); toggleSelect(S.cur); }
  });

  // A newer zone is said once per version, to whoever has the page open, and stays until it is
  // answered. zone keeps GitHub's answer for twelve hours, so this asks GitHub at most twice a
  // day however often the page is opened (see /api/update).
  async function tellOfUpdate() {
    let u;
    try { u = await api("/api/update"); } catch (_) { return; }
    if (!u.newer || !u.latest || store.get("toldOf", "") === u.latest) return;
    const box = $("toast"), told = () => { store.set("toldOf", u.latest); box.hidden = true; };
    clearTimeout(toastTimer);
    box.replaceChildren("zone " + u.latest + " is available.", btn(null, "How to update", () => { told(); go("settings"); }), btn(null, "Later", told));
    box.hidden = false;
  }

  refreshStatus(true).then(route).then(tellOfUpdate);
  setInterval(refreshStatus, 5000);
  setInterval(tellOfUpdate, 6 * 3600 * 1000);
  // A page nobody is looking at is not given its timers (a tab in the background, Zone for
  // Mac's History window while it is closed). When it is looked at again it asks at once, so
  // what arrived meanwhile, or a zone that was updated, is there without a wait.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshStatus(); });
})();
</script>
</body>
</html>
