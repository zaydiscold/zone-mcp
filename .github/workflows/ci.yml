# Runs the tests and the linter on every push and pull request, on the three systems zone
# supports. Nothing here needs a secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No test asks GitHub whether a newer zone is out.
  ZONE_NO_UPDATE_CHECK: "1"

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --no-fail-fast

  # The linter runs with the oldest Rust the project supports (rust-version in Cargo.toml), so
  # it also proves that version still builds everything, and a new Rust release with new lints
  # cannot turn a green build red by itself.
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.91
        shell: bash
        run: |
          rustup toolchain install 1.91 --profile minimal --component clippy --no-self-update
          rustup default 1.91
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh is plain sh
        run: |
          shellcheck --shell=sh install.sh
          sh -n install.sh
          dash -n install.sh

      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: The Homebrew formula is valid Ruby
        run: ruby -c packaging/homebrew/zone.rb
