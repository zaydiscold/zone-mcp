# Runs the tests and the linter on every push and pull request, on the three systems zone
# supports. Nothing here needs a secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No test asks GitHub whether a newer zone is out.
  ZONE_NO_UPDATE_CHECK: "1"

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --no-fail-fast

      - name: Exercise the Raycast extension with the Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'Raycast Test'
          $env:ZONE_HOME = Join-Path $env:LOCALAPPDATA 'library'
          $bin = Join-Path $env:LOCALAPPDATA 'Zone/bin'
          $backup = Join-Path $env:LOCALAPPDATA 'backups/demo.zonebackup'
          New-Item -Type Directory -Force $bin, $backup | Out-Null
          $env:ZONE_TEST_BIN = Join-Path $bin 'zone.exe'
          $env:ZONE_TEST_HOME = $env:ZONE_HOME
          Copy-Item target/debug/zone.exe $env:ZONE_TEST_BIN
          $env:ZONE_TEST_WINDOWS_INSTALL = (Resolve-Path $env:ZONE_TEST_BIN).Path
          $notes = 1..42 | ForEach-Object { @{id = [guid]::NewGuid().ToString(); text = "The demo note $_"; createdAt = 816120000 + $_} }
          @{formatVersion=1; createdAt=816120100; notes=$notes; dictations=@(); meetings=@()} | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $backup 'library.json') -Encoding utf8NoBOM
          & $env:ZONE_TEST_BIN backup-folder (Split-Path $backup)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test raycast-extension/tests/cli.test.mts

  # Windows on ARM (many new laptops): the release builds zone there too. The image may lack
  # rustup, and ring (under iroh) compiles its arm64 code for Windows with clang only.
  test-windows-arm:
    name: Test (Windows on ARM)
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rustup and clang
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile $init
            & $init -y --profile minimal --default-toolchain none --no-modify-path
            Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE '.cargo\bin')
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $llvm = 'C:\Program Files\LLVM\bin'
            if (-not (Test-Path (Join-Path $llvm 'clang.exe'))) { choco install llvm --yes --no-progress }
            Add-Content $env:GITHUB_PATH $llvm
          }

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --no-fail-fast

  # The linter runs with the oldest Rust the project supports (rust-version in Cargo.toml), so
  # it also proves that version still builds everything, and a new Rust release with new lints
  # cannot turn a green build red by itself.
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.91
        shell: bash
        run: |
          rustup toolchain install 1.91 --profile minimal --component clippy --no-self-update
          rustup default 1.91
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh is plain sh
        run: |
          shellcheck --shell=sh install.sh
          sh -n install.sh
          dash -n install.sh

      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: The Homebrew formula is valid Ruby
        run: ruby -c packaging/homebrew/zone.rb
