# Builds zone for every system when a version tag (v0.2.0) is pushed, and attaches the
# archives and their checksums to a DRAFT release. Nothing is public until a person opens the
# draft on GitHub and publishes it. Nothing here needs a secret: the token GitHub gives every
# run is enough.
#
# The archives are the ones install.sh, install.ps1 and `zone update` download:
#   zone-<version>-macos-universal.tar.gz   (arm64 and x86_64 in one program)
#   zone-<version>-linux-x86_64.tar.gz      (static, runs on any distribution)
#   zone-<version>-linux-aarch64.tar.gz
#   zone-<version>-windows-x86_64.zip       (CLI, login launcher and notification-area app)
#   zone-<version>-windows-aarch64.zip      (the same for Windows on ARM)
#   SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            os: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          - platform: windows-x86_64
            os: windows-2025
            targets: x86_64-pc-windows-msvc
          # Built on ARM, so the program can be run (and the install script tried) where it is
          # meant to run, as for Linux on arm64.
          - platform: windows-aarch64
            os: windows-11-arm
            targets: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag must say what Cargo.toml says: the scripts find the archives by the tag, and
      # `zone --version` and `zone update` go by the version built in.
      - name: Check the tag against Cargo.toml
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::The tag is $tag, and Cargo.toml says version $manifest. Change one to match the other."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The ARM image may lack rustup, and ring (under iroh) compiles its arm64 code for
      # Windows with clang only.
      - name: Rustup and clang (Windows on ARM)
        if: matrix.platform == 'windows-aarch64'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile $init
            & $init -y --profile minimal --default-toolchain none --no-modify-path
            Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE '.cargo\bin')
          }
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $llvm = 'C:\Program Files\LLVM\bin'
            if (-not (Test-Path (Join-Path $llvm 'clang.exe'))) { choco install llvm --yes --no-progress }
            Add-Content $env:GITHUB_PATH $llvm
          }

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.targets }}
          rustc --version

      - name: Install the musl C compiler
        if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build
        shell: bash
        env:
          # Windows: the C runtime is built in, so zone.exe needs nothing installed beside it.
          RUSTFLAGS: ${{ startsWith(matrix.platform, 'windows-') && '-C target-feature=+crt-static' || '' }}
          # Linux: the C parts (SQLite, the ciphers) are compiled for musl too.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target"
          done

      - name: Package (macOS)
        if: matrix.platform == 'macos-universal'
        shell: bash
        run: |
          mkdir -p stage dist
          lipo -create -output stage/zone \
            target/aarch64-apple-darwin/release/zone \
            target/x86_64-apple-darwin/release/zone
          # An ad hoc signature over both halves: Apple silicon runs nothing unsigned.
          codesign --force --sign - stage/zone
          lipo -info stage/zone
          codesign --verify --verbose stage/zone
          stage/zone --version
          cp LICENSE stage/
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata --uid 0 --gid 0 --uname root --gname wheel \
            -C stage -czf "dist/zone-${{ steps.version.outputs.version }}-${{ matrix.platform }}.tar.gz" zone LICENSE

      - name: Package (Linux)
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          mkdir -p stage dist
          cp "target/${{ matrix.targets }}/release/zone" stage/zone
          stage/zone --version
          # Static: it must not ask for any shared library.
          if ldd stage/zone 2>&1 | grep -q '=>'; then
            echo "::error::zone is not a static program"
            ldd stage/zone
            exit 1
          fi
          cp LICENSE stage/
          tar -C stage -czf "dist/zone-${{ steps.version.outputs.version }}-${{ matrix.platform }}.tar.gz" zone LICENSE

      - name: Package (Windows)
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage, dist -Force | Out-Null
          Copy-Item "target/${{ matrix.targets }}/release/zone.exe" stage/zone.exe
          Copy-Item "target/${{ matrix.targets }}/release/zonew.exe" stage/zonew.exe
          Copy-Item "target/${{ matrix.targets }}/release/zone-tray.exe" stage/zone-tray.exe
          & stage/zone.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Each program is for the processor of its archive. The PE header says which:
          # 0x8664 is x86_64, 0xAA64 is arm64.
          $wanted = if ('${{ matrix.platform }}' -eq 'windows-aarch64') { 0xAA64 } else { 0x8664 }
          foreach ($program in 'stage/zone.exe', 'stage/zonew.exe', 'stage/zone-tray.exe') {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $program))
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            # The subsystem: 3 is a console program (zone.exe), 2 a windowed one (zonew.exe).
            $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
            $expectedSubsystem = if ($program -eq 'stage/zone.exe') { 3 } else { 2 }
            if ($machine -ne $wanted -or $subsystem -ne $expectedSubsystem) {
              Write-Error ("{0}: machine 0x{1:X4} subsystem {2}, expected 0x{3:X4} subsystem {4}" -f $program, $machine, $subsystem, $wanted, $expectedSubsystem)
              exit 1
            }
          }
          Copy-Item LICENSE stage/LICENSE.txt
          Compress-Archive -Path stage/zone.exe, stage/zonew.exe, stage/zone-tray.exe, stage/LICENSE.txt -DestinationPath "dist/zone-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip"

      - name: The built program says the tagged version
        shell: bash
        run: |
          said="$(stage/zone --version)"
          if [ "$said" != "zone ${{ steps.version.outputs.version }}" ]; then
            echo "::error::Built \"$said\", expected \"zone ${{ steps.version.outputs.version }}\""
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zone-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The install script, run for real against the archives just built, before anything is
  # attached to a release.
  try-install:
    name: Try install.sh (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zone-*
          path: served/download/${{ github.ref_name }}
          merge-multiple: true

      - name: Install from a local copy of the release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ( cd "served/download/$GITHUB_REF_NAME" && (sha256sum zone-* 2>/dev/null || shasum -a 256 zone-*) > SHA256SUMS && cat SHA256SUMS )
          python3 -m http.server 8765 --bind 127.0.0.1 --directory served >/dev/null 2>&1 &
          curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null "http://127.0.0.1:8765/download/$GITHUB_REF_NAME/SHA256SUMS"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          ZONE_INSTALL_BASE_URL="http://127.0.0.1:8765" ZONE_VERSION="$version" sh install.sh
          test "$("$HOME/.local/bin/zone" --version)" = "zone $version"
          # A second run is an update, and leaves the same program.
          ZONE_INSTALL_BASE_URL="http://127.0.0.1:8765" ZONE_VERSION="$version" sh install.sh
          "$HOME/.local/bin/zone" status

  # install.ps1, run for real against the Windows archives just built: on Intel, on ARM with
  # the ARM archive, and on ARM as if the release had no ARM archive (the Intel one, emulated).
  try-install-windows:
    name: Try install.ps1 (${{ matrix.os }}${{ matrix.without_arm && ', no ARM archive' || '' }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            expect: windows-x86_64
          - os: windows-11-arm
            expect: windows-aarch64
          - os: windows-11-arm
            expect: windows-x86_64
            without_arm: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zone-windows-*
          path: served/download/${{ github.ref_name }}
          merge-multiple: true

      - name: Install from a local copy of the release
        shell: pwsh
        env:
          WITHOUT_ARM: ${{ matrix.without_arm && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $served = "served/download/$env:GITHUB_REF_NAME"
          if ($env:WITHOUT_ARM) { Remove-Item "$served/zone-$version-windows-aarch64.zip" }
          Get-ChildItem $served -Filter 'zone-*' | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content "$served/SHA256SUMS"
          Get-Content "$served/SHA256SUMS"
          # A small web server for the release folder, as GitHub would serve it.
          $root = (Resolve-Path served).Path
          $server = Start-Job -ArgumentList $root -ScriptBlock {
            param($root)
            $listener = [System.Net.HttpListener]::new()
            $listener.Prefixes.Add('http://127.0.0.1:8765/')
            $listener.Start()
            while ($true) {
              $context = $listener.GetContext()
              $file = Join-Path $root ($context.Request.Url.AbsolutePath.TrimStart('/') -replace '/', '\')
              if (Test-Path -LiteralPath $file -PathType Leaf) {
                $bytes = [IO.File]::ReadAllBytes($file)
                $context.Response.ContentLength64 = $bytes.Length
                $context.Response.OutputStream.Write($bytes, 0, $bytes.Length)
              } else {
                $context.Response.StatusCode = 404
              }
              $context.Response.Close()
            }
          }
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest "http://127.0.0.1:8765/download/$env:GITHUB_REF_NAME/SHA256SUMS" -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            $env:ZONE_INSTALL_BASE_URL = 'http://127.0.0.1:8765'
            $env:ZONE_VERSION = $version
            $env:ZONE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'zone-bin'
            $env:ZONE_INSTALL_NO_PATH = '1'
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 | Out-String
            $out
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if ($out -notmatch "for ${{ matrix.expect }}") { Write-Error "installed the wrong build"; exit 1 }
            $said = & (Join-Path $env:ZONE_INSTALL_DIR 'zone.exe') --version
            if ($said -ne "zone $version") { Write-Error "zone.exe says $said"; exit 1 }
            if (-not (Test-Path (Join-Path $env:ZONE_INSTALL_DIR 'zonew.exe'))) { Write-Error 'zonew.exe was not installed'; exit 1 }
            $env:ZONE_HOME = Join-Path $env:RUNNER_TEMP 'zone-test-library'
            $tray = Join-Path $env:ZONE_INSTALL_DIR 'zone-tray.exe'
            $trayVersion = & $tray --version | Out-String
            if ($LASTEXITCODE -ne 0 -or $trayVersion.Trim() -ne "zone-tray $version") { throw "Wrong tray version: $trayVersion" }
            $menu = & $tray --print-menu | Out-String
            if ($LASTEXITCODE -ne 0 -or $menu -notmatch 'Copy MCP settings' -or $menu -notmatch 'Start zone') { throw "Unexpected tray menu: $menu" }
            # A second run is an update, and leaves the same programs.
            & powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
            if ($LASTEXITCODE -ne 0) { exit 1 }
            & (Join-Path $env:ZONE_INSTALL_DIR 'zone.exe') status
          } finally {
            Stop-Job $server -ErrorAction SilentlyContinue
            Remove-Job $server -Force -ErrorAction SilentlyContinue
          }

  release:
    name: Draft release
    needs: [build, try-install, try-install-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zone-*
          path: dist
          merge-multiple: true

      - name: Write the checksums
        run: |
          cd dist
          ls -l
          set -- zone-*
          test "$#" -eq 5
          sha256sum zone-* > SHA256SUMS
          cat SHA256SUMS

      # The formula with this release's version and checksums filled in, ready to be copied
      # into a tap. It is attached to the release beside the archives.
      - name: Fill in the Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          sum() { awk -v file="zone-$version-$1" '$2 == file { print $1 }' dist/SHA256SUMS; }
          sed \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/sha256 \"[0-9a-f]*\" # macos-universal/sha256 \"$(sum macos-universal.tar.gz)\" # macos-universal/" \
            -e "s/sha256 \"[0-9a-f]*\" # linux-x86_64/sha256 \"$(sum linux-x86_64.tar.gz)\" # linux-x86_64/" \
            -e "s/sha256 \"[0-9a-f]*\" # linux-aarch64/sha256 \"$(sum linux-aarch64.tar.gz)\" # linux-aarch64/" \
            packaging/homebrew/zone.rb > dist/zone.rb
          ruby -c dist/zone.rb
          if grep -q '"0\{64\}"' dist/zone.rb; then
            echo "::error::A checksum in the formula was not filled in"
            exit 1
          fi
          cat dist/zone.rb

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "zone $version" \
            --generate-notes \
            dist/zone-* dist/SHA256SUMS dist/zone.rb
