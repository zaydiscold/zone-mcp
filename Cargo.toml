[package]
name = "zone"
version = "0.1.4"
default-run = "zone"
edition = "2024"
rust-version = "1.91"
description = "Receives an iPhone's Zone dictation library and serves it to people and AI agents"
license = "MIT"
repository = "https://github.com/zaydiscold/zone-mcp"
homepage = "https://apps.apple.com/app/id6830955448"
authors = ["Zayd <iam@zayd.wtf>"]
publish = false

[[bin]]
name = "zone"
path = "src/main.rs"

# Windows only (elsewhere it says so and does nothing): starts zone.exe with no console
# window, for the login entry. A program of its own because Windows opens a console window for
# a console program before that program can do anything about it.
[[bin]]
name = "zonew"
path = "src/bin/zonew.rs"

# Windows only (elsewhere it only prints the menu as text): Zone's icon beside the clock, with
# its menu. A windowed program that makes no window. It runs the zone.exe beside it for
# everything it shows, so none of zone's own code (the library, the network) is built into it.
[[bin]]
name = "zone-tray"
path = "src/bin/zone-tray.rs"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.11"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = "1.4.1"
jiff = "0.2"
miniz_oxide = "0.8"
png = "0.18"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "encoding_rs"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: every number is parsed to the nearest double, so a phone's timestamp
# arrives to the last bit. Without it about one in five arrives one binary digit off.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
# Only to hand iroh the proxy address (proxy.rs). Already in the build through iroh.
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }

# Only to notice that whoever was reading `zone events --follow` has gone away, and to stop a
# zone by its process id.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The clipboard and the person's own registry values (the login entry), called directly: see
# src/win.rs. And the tray icon and its menu: see src/tray/win.rs. Already in the build through
# tokio and iroh, so this adds no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# The image and cipher crates are far too slow unoptimized for the Flash tests, which read
# QR codes out of pictures. Everything else builds as usual.
[profile.dev.package.g2p]
opt-level = 3
[profile.dev.package.rqrr]
opt-level = 3
[profile.dev.package.rxing]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.qrcode]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
