instructions: |
  - Zone is the person's own library from Zone for iPhone, kept on this computer by the zone program. There are four kinds of item:
    - `dictation`: something they dictated. Source `keyboard` was typed by voice into another app (messages, emails, search boxes), so it is usually short and addressed to someone else. Source `app` was dictated inside Zone.
    - `note`: a voice note they chose to save: a note to self. A note not marked done is an open to-do.
    - `meeting`: a recorded meeting with a title and a transcript, one `Speaker: words` line per turn.
    - `clip`: text the person sent from the phone to this computer on purpose. It is exact text, not speech. The newest clip is "the thing I just sent you": use `get-latest-clip`.
  - Dictations, notes and meetings are speech turned into text on the phone, so expect recognition mistakes, missing punctuation, misheard names and informal phrasing. Read past obvious mistakes, and when quoting, quote what the text says rather than silently correcting it. When a name finds nothing, search for a shorter beginning with `*` (for example `Anders*`) or a likely mishearing.
  - For a question about a time ("yesterday afternoon", "on Wednesday"), use `list-zone-items` with `since` and `until`. Work out dates from the `now` field the tools return; it has the weekday and the UTC offset. For a question about a topic or a name, use `search-zone`. Both return short cards; call `get-zone-items` with the ids before summarizing or quoting anything longer than the preview.
  - Never invent ids. Use only ids that a Zone tool returned.
  - "My notes", "my to-dos" or "what is left" means `get-open-notes`. Only call `mark-notes-done` when the person asks to mark, tick or check notes off, and only with note ids.
  - This is private speech. Quote only as much as the request needs, and summarize rather than dump whole transcripts unless asked.
  - Give times in the person's local time, with the weekday when it helps.

evals:
  - input: "@zone what did I just send from my phone?"
    mocks:
      get-latest-clip:
        clip:
          id: DE400000-0000-4000-8000-000000000024
          source: clipboard
          time: "2026-11-19T08:57:02-08:00"
          ageSeconds: 120
          characters: 50
          text: "https://example.invalid/ferry/timetable?day=friday"
    expected:
      - callsTool: get-latest-clip
      - includes: "example.invalid/ferry/timetable"

  - input: "@zone what's still on my to-do list?"
    mocks:
      get-open-notes:
        open: 2
        more: false
        notes:
          - id: DE400000-0000-4000-8000-000000000014
            kind: note
            source: null
            time: "2026-11-19T09:25:54-08:00"
            words: 13
            done: false
            text: "Call the dentist about moving the cleaning to the first week of December."
            truncated: false
          - id: DE400000-0000-4000-8000-000000000034
            kind: note
            source: null
            time: "2026-11-19T08:07:18-08:00"
            words: 21
            done: false
            text: "Draft the outline for the harbor talk. Start with the story about the lantern, then the three numbers, then the ask."
            truncated: false
    expected:
      - callsTool: get-open-notes
      - includes: "dentist"
      - not:
          callsTool: mark-notes-done

  - input: "@zone summarize my last meeting"
    mocks:
      get-latest-meeting:
        meetings: 15
        meeting:
          id: DE400000-0000-4000-8000-000000000044
          kind: meeting
          source: null
          time: "2026-11-19T07:17:39-08:00"
          title: "Harbor talk run-through"
          length: "3:16"
          words: 128
          speakers: ["Ada", "Grace", "Me"]
          text: |
            [0:00] Ada: Okay, let us run it from the top. You have twelve minutes and the room is about forty people.
            [0:09] Grace: I will start with the lantern story. It takes about ninety seconds if I do not wander.
            [0:17] Me: Keep it. That story is the reason anyone remembers the rest.
            [0:24] Grace: Then the three numbers: crossings per week, how many were late, and what a late one costs.
            [0:33] Me: Can you put the cost on its own slide? It got lost last time.
            [0:40] Ada: Yes. One number, large, nothing else on it.
            [0:46] Me: And the ask at the end needs a date. People agree to things with dates.
            [0:53] Ada: The fifteenth, then. I will say it twice.
          truncated: false
    expected:
      - callsTool: get-latest-meeting
      - meetsCriteria: "Summarizes a rehearsal of a harbor talk and mentions putting the cost on its own slide or asking for a date (the fifteenth)."

  - input: "@zone what did I say about the harbor talk?"
    mocks:
      search-zone:
        now: "Thursday 2026-11-19T10:00:00-08:00"
        total: 1
        nextCursor: null
        items:
          - id: DE400000-0000-4000-8000-000000000008
            kind: dictation
            source: app
            time: "2026-11-19T09:43:24-08:00"
            preview: "Thinking out loud about the talk. The opening is too slow. People do not need the history, they need the one picture of the harbor at night and then the question."
            truncated: false
            words: 33
            length: "0:12"
            snippet: "the one picture of the [harbor] at night"
    expected:
      - callsTool:
          name: search-zone
          arguments:
            query:
              includes: "harbor"
      - includes: "opening"

  - input: "@zone what did I dictate yesterday afternoon?"
    usedAsExample: false
    mocks:
      list-zone-items:
        now: "Thursday 2026-11-19T10:00:00-08:00"
        total: 1
        more: false
        items:
          - id: DE400000-0000-4000-8000-0000000000A0
            kind: dictation
            source: keyboard
            time: "2026-11-18T14:12:00-08:00"
            preview: "Can we move the ferry meeting to Friday morning?"
            truncated: false
            words: 10
    expected:
      - callsTool:
          name: list-zone-items
          arguments:
            since:
              includes: "2026-11-18"
      - includes: "ferry"

  - input: "@zone mark the dentist note as done"
    usedAsExample: false
    mocks:
      get-open-notes:
        open: 1
        more: false
        notes:
          - id: DE400000-0000-4000-8000-000000000014
            kind: note
            source: null
            time: "2026-11-19T09:25:54-08:00"
            words: 13
            done: false
            text: "Call the dentist about moving the cleaning to the first week of December."
            truncated: false
      mark-notes-done:
        updated: 1
        done: true
        notFound: []
        notNotes: []
    expected:
      - callsTool:
          name: mark-notes-done
          arguments:
            ids:
              includes: "DE400000-0000-4000-8000-000000000014"
